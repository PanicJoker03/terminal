<section class="boss-chart" aria-label="Boss chart panel">

    <h2>Necesidades empresa</h2>
  </div>

  <table class="boss-table" aria-label="Boss needs matrix">
    <thead>
      <tr>
        <th colspan="2" rowspan="2"></th>
        <th colspan="2">Necesidades Empresa</th>
      </tr>
      <tr>
        <th>No</th>
        <th>Si</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <th rowspan="2">Expectativas</th>
        <th>No</th>

        <td>Área Técnica</td>

        <th>Si</th>
        <td>Área Política</td>

      </tr>
    </tbody>
  </table>

  <div class="chart-legend">
    <p>.jefe.tiene.expectativas</p>
    <p>.jefe.es.humano,.comunicación,.hacer.preguntar.no.hostigar.</p>
