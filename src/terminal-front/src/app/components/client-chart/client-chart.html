<section class="client-chart" aria-label="Client chart panel">
  <div class="client-chart-header">
    <h2>Necesidades Cliente</h2>
  </div>

  <table class="client-table" aria-label="Client needs matrix">
    <thead>
      <tr>
        <th colspan="2" rowspan="2"></th>
        <th colspan="2">Necesidades Cliente</th>
      </tr>
      <tr>
        <th>No</th>
        <th>Si</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <th rowspan="2">Productos</th>
        <th>No</th>
        <td>Basura</td>
        <td>Idea</td>
      </tr>
      <tr>
        <th>Si</th>
        <td>Servicio</td>
        <td>Venta Estratégica</td>
      </tr>
    </tbody>
  </table>

  <div class="chart-legend">
    <p>.cliente.tiene.necesidades</p>
    <p>.cliente.siempre.tiene.la.razon</p>
  </div>
</section>
