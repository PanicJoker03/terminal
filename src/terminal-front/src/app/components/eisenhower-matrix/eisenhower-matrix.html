<section class="eisenhower-matrix" aria-label="Eisenhower matrix">
  <div class="matrix-header">
    <h2>Matriz de Eisenhower</h2>
  </div>

  <div class="matrix-table-wrap">
    <table class="matrix-table" aria-label="Matriz de tareas por urgencia e importancia">
      <thead>
        <tr>
          <th scope="col"></th>
          <th scope="col">Urgente</th>
          <th scope="col">No Urgente</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Importante</th>
          <td>Tareas para hacer primero, antes de 24 hrs</td>
          <td>Se programan para mas adelante, se pueden hacer a futuro</td>
        </tr>
        <tr>
          <th scope="row">No importante</th>
          <td>Tareas para delegar a otras personas</td>
          <td>Tareas para eliminar</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
