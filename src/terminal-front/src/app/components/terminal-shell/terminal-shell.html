<section class="terminal-shell" aria-label="Terminal shell">
  <div class="shell-layout">
    <aside class="jobs-panel" aria-label="Job applications panel">
      <div class="jobs-panel-header">
        <h2>Job Applications</h2>
      </div>

      <div class="jobs-panel-table-wrap">
        <table mat-table [dataSource]="jobRows" class="jobs-table" aria-label="Job applications grid">
          <ng-container matColumnDef="company">
            <th mat-header-cell *matHeaderCellDef>Company</th>
            <td mat-cell *matCellDef="let row">{{ row.company }}</td>
          </ng-container>

          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>Role</th>
            <td mat-cell *matCellDef="let row">{{ row.role }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let row">{{ row.status }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </aside>

    <div class="terminal-panel">
      <header class="terminal-bar">
        <div class="traffic-lights" aria-hidden="true">
          <span class="traffic-light red"></span>
          <span class="traffic-light yellow"></span>
          <span class="traffic-light green"></span>
        </div>
        <div class="terminal-title">terminal</div>
      </header>

      <main #terminalOutput class="terminal-output" aria-live="polite">
        @for (line of terminalLines | async; track $index) {
          <div class="terminal-line line-{{ line.type }}">
            <span class="line-prefix">{{ line.type === 'command' ? '>' : '·' }}</span>
            <span>{{ line.text }}</span>
          </div>
        }
      </main>

      <form class="terminal-input-row" (ngSubmit)="submitCommand()">
        <label class="prompt" for="cmd-input">{{ prompt() }}</label>
        <input
          id="cmd-input"
          class="terminal-input"
          type="text"
          name="command"
          [(ngModel)]="command"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="type a command"
          aria-label="Terminal command input"
        />
      </form>
    </div>
  </div>
</section>
