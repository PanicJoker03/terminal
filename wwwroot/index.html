<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal</title>
    <style>
      body { font-family: 'Space Mono',monospace; background:#111; color:#eee; }

      .code-jetbrains { font-family: 'JetBrains Mono', monospace; }
      .code-fira      { font-family: 'Fira Code', monospace; }
      .code-space     { font-family: 'Space Mono', monospace; }
      
      #output { 
        width: 100%; 
        height: 70vh; 
        background: #000; 
        color: #0f0; 
        padding: 10px; 
        overflow:auto; 
      }
      #input { 
        width:100%; 
        box-sizing:border-box; 
        padding:8px;
        font-family: 'JetBrains Mono', monospace;
      }
      
      .wrapper-input {
        display: flex;
      }
      
      button{padding:8px}
      
      #send {
        background-color: #00adfd;
        color: white;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  </head>
  <body>
    <h3>Terminal</h3>
    <div id="output"></div>
    <div class="wrapper-input">
      <input id="input" placeholder="Type command or press Enter" />
      <button id="send">Send</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.7/signalr.min.js"></script>
    <script src="/terminal/terminal.js"></script>
  </body>
</html>
