<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal</title>
    <style>
      body { font-family: monospace; background:#111; color:#eee; }
      #output { width: 100%; height: 70vh; background: #000; color: #0f0; padding: 10px; overflow:auto; }
      #input { width:100%; box-sizing:border-box; padding:8px; }
      button{padding:8px}
    </style>
  </head>
  <body>
    <h3>Terminal</h3>
    <div id="output"></div>
    <input id="input" placeholder="Type command or press Enter" />
    <button id="send">Send</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.7/signalr.min.js"></script>
    <script src="/terminal.js"></script>
  </body>
</html>
